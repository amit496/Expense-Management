name: expense_tracker_app
description: "Advanced Expense Management App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  intl: ^0.20.2
  fl_chart: ^0.68.0
  provider: ^6.1.2
  flutter_slidable: ^3.1.1
  local_auth: ^2.3.0
  share_plus: ^10.1.4
  path_provider: ^2.1.5
  csv: ^6.0.0
  file_picker: ^8.1.7
  connectivity_plus: ^6.1.4
  flutter_local_notifications: ^18.0.1
  flutter_timezone: ^3.0.1
  timezone: ^0.9.4
  flutter_email_sender: ^6.0.3
  flutter_native_splash: ^2.4.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_native_splash:
  color: "#0D1117"
  color_dark: "#0D1117"
  image: assets/app_icon.png
  android_12:
    color: "#0D1117"
    image: assets/app_icon.png
  android: true
  ios: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.png"
  adaptive_icon_background: "#7C3AED"
  adaptive_icon_foreground: "assets/app_icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/app_icon.png"
  windows:
    generate: true
    image_path: "assets/app_icon.png"
  macos:
    generate: true
    image_path: "assets/app_icon.png"

flutter:
  uses-material-design: true
